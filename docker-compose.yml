services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haupcar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d haupcar']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/haupcar?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/haupcar?schema=public
      JWT_SECRET: interview-haupcar-docker-jwt-secret
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      SUPABASE_URL: http://localhost
      SUPABASE_PUBLISHABLE_KEY: local-review
      SUPABASE_SECRET_KEY: local-review
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: /api
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
